services:

  db:
    image: postgres:17
    container_name: atlas_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aitbek
      POSTGRES_DB: atlas_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    restart: always

    ports:
      - "6381:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: atlas_minio
    restart: always

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlaspassword

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  api:
    build: .
    container_name: atlas_api
    restart: always

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

    ports:
      - "8001:8000"

    env_file:
      - .env.docker

    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_2GIS_API_KEY: ${VITE_2GIS_API_KEY:-}
    container_name: atlas_frontend
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

  nginx:
    image: nginx:1.27-alpine
    container_name: atlas_nginx
    restart: always

    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  postgres_data:
  redis_data:
  minio_data:
