services:

  db:
    image: postgres:17
    container_name: atlas_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aitbek
      POSTGRES_DB: atlas_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    restart: always

    ports:
      - "6381:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: atlas_minio
    restart: always

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlaspassword

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

  api:
    build: .
    container_name: atlas_api
    restart: always

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

    ports:
      - "8001:8000"

    env_file:
      - .env.docker

    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  nginx:
    image: nginx:latest
    container_name: atlas_nginx
    restart: always

    depends_on:
      - api

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
